<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Bebas+Neue&family=DM+Mono&display=swap" rel="stylesheet">
<style>:root{--navy:#0a1428;--navy2:#13244a;--navy3:#1d3466;--gold:#f5b82e;--gold-d:#c98a00;--cream:#fff8e8;--ink:#14213d;--teal:#19b7a3;--teal-d:#0e8576;--red:#e5484d;--green:#2fa862;--btc:#f7931a;--soft:#eef2fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Barlow","Trebuchet MS",Verdana,system-ui,sans-serif;font-size:20px;color:var(--ink);background:var(--navy) radial-gradient(ellipse at 80% -10%,#2b4b92 0,var(--navy) 60%) fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
h1,h2,h3{font-family:"Bebas Neue","Barlow","Trebuchet MS",Impact,sans-serif;letter-spacing:.03em;font-weight:400;margin:.15em 0}

/* top bar */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(10,20,40,.95);color:#fff;border-bottom:2px solid rgba(245,184,46,.35)}
.top .home{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);text-decoration:none;font-size:22px;flex:none;color:#fff}
.top .ttl{font-family:"Bebas Neue","Barlow",Impact,sans-serif;font-size:24px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw;color:var(--gold)}
.pbar{flex:1;min-width:40px;height:14px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--btc));border-radius:9px;transition:width .5s}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 13px 5px 8px;font-weight:700;white-space:nowrap;font-size:19px}
.chip svg{width:26px;height:26px}
.tbtn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;flex:none}
.tbtn.off{opacity:.4}

#app{max-width:1000px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--cream);border-radius:26px;padding:20px 22px;box-shadow:0 10px 0 rgba(0,0,0,.28),0 22px 44px rgba(0,0,0,.38);animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.title{font-size:clamp(34px,6vw,58px);color:var(--navy2);text-align:center;line-height:1.05}
h2.pt{font-size:clamp(30px,4.6vw,44px);color:var(--navy2)}
.sub{text-align:center;font-size:clamp(19px,2.6vw,24px);line-height:1.5;margin:6px 0}
.txt{font-size:clamp(21px,2.8vw,27px);line-height:1.6;margin:8px 0}
.txt .w{border-radius:6px;padding:0 1px;transition:background .15s}
.txt .w.hl{background:#ffd95e}
.center{text-align:center}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
.note{font-size:15px;color:#5e6c92;text-align:center;margin:4px 0}

/* buttons */
.btn{border:0;border-radius:18px;padding:12px 26px;font-size:clamp(20px,2.8vw,25px);font-weight:700;color:var(--navy);background:var(--gold);box-shadow:0 6px 0 var(--gold-d);min-height:60px;transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
.btn.alt{background:var(--teal);color:#fff;box-shadow:0 6px 0 var(--teal-d)}
.btn.alt:active{box-shadow:0 2px 0 var(--teal-d)}
.btn.ghost{background:#dfe7fb;color:#26407a;box-shadow:0 6px 0 #b4c2ea}
.btn.ghost:active{box-shadow:0 2px 0 #b4c2ea}

  K.logoEl = function (cls) { var i = document.createElement('img'); i.src = K.LOGO; i.alt = 'Suns School of Satoshi'; i.className = cls || 'brandlogo'; return i; };
  var BUILD_KEY = 'de9b5541-167a-42f7-81cc-020c5b0f42d1';
  var PKEY = 'kca_pending_v1';
  function w3key() { var k = (settings.w3key || '').replace(/\s/g, ''); if (!k && BUILD_KEY.indexOf('__') !== 0) { k = BUILD_KEY; } return k; }
  function getPending() { try { return JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { return []; } }
  function setPending(a) { try { localStorage.setItem(PKEY, JSON.stringify(a.slice(-20))); } catch (e) {} }
  function post(p, key) {
    var body = { access_key: key, subject: p.subject, from_name: 'Kids Crypto Academy', message: p.message, botcheck: '' };
    return fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!(r.ok && j.success !== false)) { throw new Error(j.message || ('HTTP ' + r.status)); } return j; }); });
  }
  K.hasKey = function () { return !!w3key(); };
  K.pendingCount = function () { return getPending().length; };
  K.sendReport = function (p) {
    var key = w3key();
    function queue(res) { var a = getPending(); a.push(p); setPending(a); return res; }
    if (!key) { return Promise.resolve(queue('nokey')); }
    return post(p, key).then(function () { return 'sent'; }, function () { return queue('queued'); });
  };
  K.flush = function () {
    var key = w3key(), a = getPending();
    if (!key || !a.length || (typeof navigator.onLine === 'boolean' && !navigator.onLine)) { return; }
    setPending([]);
    a.forEach(function (p) { post(p, key).catch(function () { var b = getPending(); b.push(p); setPending(b); }); });
  };
  K.sendTest = function () {
    var key = w3key(); if (!key) { return Promise.resolve('nokey'); }
    return post({ subject: 'Test from Kids Crypto Academy', message: 'This is a test. Course grades and certificates will arrive in this inbox.' }, key)
      .then(function () { return 'sent'; }, function (e) { return 'error: ' + (e && e.message ? e.message : 'could not send'); });
  };

  setTimeout(K.flush, 2500);

  K.setupPanel = function () {
    var d = document.createElement('details'); d.className = 'setup noprint';
    d.innerHTML = '<summary>👨‍👧 Grown-up setup: email grades and certificates</summary>' +

    var inp = d.querySelector('#w3k'), msg = d.querySelector('#w3m');
    function stat() { var n = K.pendingCount(); msg.textContent = (K.hasKey() ? 'Email reports are ON.' : 'Email reports are OFF until a key is saved.') + (n ? ' ' + n + ' report(s) waiting to send.' : ''); }
    inp.value = settings.w3key || '';
    d.querySelector('#w3s').onclick = function () { settings.w3key = inp.value.replace(/\s/g, ''); K.saveSettings(); stat(); K.flush(); msg.textContent += ' Saved.'; };
    d.querySelector('#w3t').onclick = function () {
      settings.w3key = inp.value.replace(/\s/g, ''); K.saveSettings(); msg.textContent = 'Sending test email...';
      K.sendTest().then(function (r) { msg.textContent = r === 'sent' ? 'Test email sent! Check your inbox (and spam folder).' : r === 'nokey' ? 'Paste your access key first.' : 'Could not send (' + r + ').'; if (r === 'sent') { K.flush(); } });
    };
    stat();
    return d;

<script>/* Kids Crypto Academy - interactive activities */
(function () {
  'use strict';
  var K = window.KCA, esc = K.esc, acts = K.acts = {};
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function once(fn) { var d = false; return function () { if (!d) { d = true; fn(); } }; }

  /* ---------- sorting cards ---------- */
  acts.cards = function (box, cfg, api) {
    var items = cfg.items, i = 0, first = 0, tried = false;
    var wrap = h('div', 'act'); box.appendChild(wrap);
    function show() {
      wrap.innerHTML = ''; tried = false;
      var it = items[i];
      wrap.appendChild(h('div', 'cnt', 'Card ' + (i + 1) + ' of ' + items.length));
      var card = h('div', 'bigcard', esc(it.t)); wrap.appendChild(card);
      var ch = h('div', 'choices'); wrap.appendChild(ch);
      var fb = h('div', 'fb'); wrap.appendChild(fb);
      var nr = h('div', 'row'); wrap.appendChild(nr);
      cfg.labels.forEach(function (lb, k) {
        var b = h('button', 'btn' + (k ? ' alt' : ''), (cfg.icons ? cfg.icons[k] + ' ' : '') + esc(lb));
        b.onclick = function () {
          if (k === it.a) {
            K.sfx.ok(); card.className = 'bigcard good'; if (!tried) { first++; }
            fb.className = 'fb good'; fb.textContent = 'Yes! ' + it.why;
            Array.prototype.forEach.call(ch.children, function (x) { x.disabled = true; });
            var nb = h('button', 'btn pulse', i < items.length - 1 ? 'Next card ▶' : 'Finish ▶');
            nb.onclick = function () {
              K.sfx.tap();
              if (i < items.length - 1) { i++; show(); }
              else { wrap.innerHTML = '<div class="sub">You got <b>' + first + ' of ' + items.length + '</b> on the first try! ⭐</div>'; api.done(); }
            };
            nr.appendChild(nb);
          } else { tried = true; K.sfx.no(); card.className = 'bigcard bad'; b.disabled = true; fb.className = 'fb bad'; fb.textContent = 'Not quite. Try the other one!'; }
        };
        ch.appendChild(b);
      });
    }
    show();
  };

  /* ---------- scam spotter ---------- */
  acts.scamspot = function (box, cfg, api) {
    var m = 0, wrap = h('div', 'act'); box.appendChild(wrap);
    function show() {
      wrap.innerHTML = ''; var M = cfg.messages[m], checked = false, flags = 0, spans = [];
      wrap.appendChild(h('div', 'cnt', 'Message ' + (m + 1) + ' of ' + cfg.messages.length));
      var bub = h('div', 'bubble'); wrap.appendChild(bub);
      M.parts.forEach(function (p) {
        var s = h('span', 'f', esc(p.t));
        if (p.f) { s.setAttribute('data-r', p.f); flags++; }
        s.onclick = function () { if (checked) { return; } s.classList.toggle('pick'); K.sfx.tap(); };
        bub.appendChild(s); spans.push(s); bub.appendChild(document.createTextNode(' '));
      });
      wrap.appendChild(h('div', 'note', 'Tap every part that looks sneaky or scary. Then press Check.'));
      var out = h('div', ''), row = h('div', 'row'); wrap.appendChild(out); wrap.appendChild(row);
      var chk = h('button', 'btn', '🔍 Check my answers');
      chk.onclick = function () {
        checked = true; chk.remove();
        var found = 0, missed = 0, falsea = 0, html = '';
        spans.forEach(function (s) {
          var pk = s.classList.contains('pick'), r = s.getAttribute('data-r'); s.classList.remove('pick');
          if (r && pk) { found++; s.classList.add('hit'); html += '<div>✅ <b>' + esc(s.textContent) + '</b>: ' + esc(r) + '</div>'; }
          else if (r) { missed++; s.classList.add('miss'); html += '<div class="m">👀 <b>' + esc(s.textContent) + '</b>: you missed this one. ' + esc(r) + '</div>'; }
          else if (pk) { falsea++; }
        });
        var good = !missed && !falsea;
        out.innerHTML = '<div class="fb ' + (good ? 'good' : 'bad') + '">' + (good ? 'Great eyes! You found all ' + flags + ' red flags! 🕵️' : 'You found ' + found + ' of ' + flags + ' red flags' + (falsea ? ' (and ' + falsea + ' part' + (falsea > 1 ? 's' : '') + ' that was actually fine)' : '') + '. Look at the green and red parts!') + '</div><div class="flaglist">' + html + '</div>';
        K.sfx[good ? 'ok' : 'no']();
        var nb = h('button', 'btn pulse', m < cfg.messages.length - 1 ? 'Next message ▶' : 'Finish ▶');
        nb.onclick = function () { K.sfx.tap(); if (m < cfg.messages.length - 1) { m++; show(); } else { api.done(); nb.remove(); } };
        row.appendChild(nb);
      };
      row.appendChild(chk);
    }
    show();
  };

  /* ---------- Coin Boss ---------- */
  acts.coinboss = function (box, cfg, api) {
    var coins = 500, price = 100, used = {}, dead = false, fin = once(function () { api.done(); });
    var wrap = h('div', 'act'); box.appendChild(wrap);
    wrap.innerHTML = '<div class="panel"><div class="box"><h3>Your wallet</h3><div class="coinpile" id="pile"></div><div class="stat" id="cc">500</div><div class="note">game coins</div>' +
      '<h3 style="margin-top:8px">A cool hat costs <span id="pr">100</span> coins</h3><div class="hatrow" id="hats"></div><div class="note" id="hn"></div></div>' +
      '<div class="box"><h3>🕹️ The Boss is in charge</h3><div class="row" style="flex-direction:column;align-items:stretch">' +
      '<button class="btn" id="bp">🖨️ Print 1,000,000 new coins</button><button class="btn alt" id="br">🏷️ Raise the prices</button><button class="btn red" id="bs">🛑 Shut down the game</button><button class="btn ghost small" id="bx">↺ Start over</button></div></div></div><div class="fb" id="bm"></div>';

    var orig = [], prevs = [], prev = '0000', cur = base.slice(), voted = false;

<script>/* Kids Crypto Academy - course engine */
(function () {
  'use strict';
  var K = window.KCA, C = window.COURSE, SK = 'kca_' + C.id + '_v1', esc = K.esc;
  var app = document.getElementById('app');

  /* ---------- state ---------- */
  var store = (function () {
    var b = { name: '', sections: {}, final: null, secs: 0, startedAt: null, finishedAt: null, cert: null, sent: false };
    var s = K.loadKey(SK) || {};
    for (var k in s) { b[k] = s[k]; }
    return b;
  })();
  function save() { K.saveKey(SK, store); }
  var lastAct = Date.now();
  ['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { lastAct = Date.now(); }, true); });
  setInterval(function () { if (!document.hidden && Date.now() - lastAct < 60000 && store.startedAt && !store.finishedAt) { store.secs += 5; if (store.secs % 30 === 0) { save(); } } }, 5000);

  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function letter(p) { return p >= 90 ? 'A' : p >= 80 ? 'B' : p >= 70 ? 'C' : p >= 60 ? 'D' : 'F'; }
  function pct(c, t) { return t ? Math.round(100 * c / t) : 0; }
  var N = C.sections.length;
  function secDone(i) { var r = store.sections[C.sections[i].id]; return !!(r && r.done); }
  function doneCount() { var n = 0; for (var i = 0; i < N; i++) { if (secDone(i)) { n++; } } return n; }
  function allDone() { return doneCount() === N; }
  function totalSats() { var t = 0, k; for (k in store.sections) { t += store.sections[k].sats || 0; } if (store.final) { t += store.final.sats || 0; } return t; }
  function overall() {
    var sum = 0, n = 0, i, r;
    for (i = 0; i < N; i++) { r = store.sections[C.sections[i].id]; if (r && r.done) { sum += r.pct; n++; } }
    if (store.final) { sum += store.final.pct; n++; }
    return n ? Math.round(sum / n) : 0;
  }

  /* ---------- chrome ---------- */
  function chips() {
    document.getElementById('chipSats').innerHTML = K.art.coin('sat') + '<span>' + totalSats() + ' sats</span>';
    document.getElementById('pbar').style.width = Math.round((doneCount() + (store.final ? 1 : 0)) / (N + 1) * 100) + '%';
  }
  function syncBtns() { document.getElementById('btnSound').classList.toggle('off', !K.settings.sound); document.getElementById('btnAuto').classList.toggle('off', !K.settings.autoread); }
  document.getElementById('btnSound').onclick = function () { K.settings.sound = !K.settings.sound; K.saveSettings(); syncBtns(); if (K.settings.sound) { K.sfx.tap(); } };
  document.getElementById('btnAuto').onclick = function () { K.settings.autoread = !K.settings.autoread; K.saveSettings(); syncBtns(); if (K.settings.autoread) { K.say('Read to me is on.'); } };
  document.getElementById('home').href = C.hubFile;
  function show(node) { K.stop(); app.innerHTML = ''; app.appendChild(node); window.scrollTo(0, 0); chips(); }
  function coinRain(n) {
    var box = h('div', 'rain');
    for (var i = 0; i < n; i++) { var c = h('i', ''); c.style.left = (Math.random() * 96) + '%'; c.style.animationDelay = (Math.random() * 1.6).toFixed(2) + 's'; c.style.animationDuration = (2.2 + Math.random() * 1.6).toFixed(2) + 's'; c.innerHTML = K.art.coin(i % 3 ? 'sat' : 'btc'); box.appendChild(c); }
    document.body.appendChild(box); setTimeout(function () { if (box.parentNode) { box.parentNode.removeChild(box); } }, 5200);
  }

  /* ---------- reading helpers ---------- */
  function readBlock(text, list) {
    var p = h('p', 'txt'); p.innerHTML = K.wordsHTML(text);
    var spans = p.querySelectorAll('.w');
    Array.prototype.forEach.call(spans, function (sp) { sp.addEventListener('click', function () { K.say(sp.textContent); }); });
    var btn = h('button', 'btn alt', '🔊 Read to me');
    btn.onclick = function () {
      K.sfx.tap();
      K.say(text, function (ci) {
        var cur = null; Array.prototype.forEach.call(spans, function (sp) { sp.classList.remove('hl'); if (+sp.getAttribute('data-s') <= ci) { cur = sp; } }); if (cur) { cur.classList.add('hl'); }
      }, function () {
        Array.prototype.forEach.call(spans, function (sp) { sp.classList.remove('hl'); });
        if (list && list.length) { K.say(list.map(function (l) { return l[1]; }).join('. ')); }
      });
    };
    if (K.settings.autoread) { setTimeout(function () { btn.click(); }, 500); }
    return { p: p, btn: btn };
  }
  function tipBox(text) { return h('div', 'tip', K.art.mascot() + '<div><b>Blip says:</b> ' + esc(text) + '</div>'); }

  /* ---------- welcome ---------- */
  function welcome() {
    var card = h('div', 'card welcome center');
    card.appendChild(h('div', '', K.art.scene('hero')));
    card.firstChild.className = '';
    card.appendChild(K.logoEl('brandlogo welcome'));
    card.appendChild(h('div', 'note', C.series.toUpperCase() + ' · COURSE 1'));
    card.appendChild(h('h1', 'title', C.title));
    var back = !!store.name && store.startedAt;
    var msg = back ? 'Welcome back, ' + esc(store.name) + '! Ready to keep going?' : 'Learn how Bitcoin works using the game coins you already know, like Robux, V-Bucks and Minecoins!';
    var p = readBlock(back ? 'Welcome back, ' + store.name + '! Ready to keep going?' : 'Learn how Bitcoin works using the game coins you already know, like Robux, V-Bucks and Minecoins!');
    p.p.className = 'sub'; card.appendChild(p.p);
    var info = h('p', 'note', '8 short sections · quizzes · a final challenge · a certificate at the end');
    card.appendChild(info);
    var row = h('div', 'row'); row.appendChild(p.btn); card.appendChild(row);
    var go;
    if (back) {
      go = h('button', 'btn pulse', 'Continue ▶'); go.onclick = function () { K.sfx.tap(); map(); };
      var wrap = h('div', 'row'); wrap.appendChild(go); card.appendChild(wrap);
    } else {
      var inp = h('input'); inp.type = 'text'; inp.maxLength = 24; inp.placeholder = 'Type your first name'; inp.setAttribute('aria-label', 'Your name'); inp.autocomplete = 'off';
      var ir = h('div', 'row'); ir.appendChild(inp); card.appendChild(ir);
      go = h('button', 'btn pulse', "Let's go! ▶"); go.disabled = true;
      inp.oninput = function () { go.disabled = !inp.value.trim(); };
      inp.onkeydown = function (e) { if (e.key === 'Enter' && inp.value.trim()) { go.click(); } };
      go.onclick = function () { store.name = inp.value.trim().replace(/\s+/g, ' '); store.startedAt = Date.now(); save(); K.sfx.ok(); map(); };
      var wr = h('div', 'row'); wr.appendChild(go); card.appendChild(wr);
    }
    card.appendChild(K.setupPanel());
    show(card);
  }

  /* ---------- course map ---------- */
  function map() {
    var card = h('div', 'card');
    card.appendChild(h('h1', 'title', 'Your Course Map'));
    card.appendChild(h('p', 'sub', 'Hi ' + esc(store.name) + '! You finished <b>' + doneCount() + ' of ' + N + '</b> sections. Finish each section to unlock the next one.'));
    var grid = h('div', 'map'), nextIdx = -1, i;
    for (i = 0; i < N; i++) { if (!secDone(i)) { nextIdx = i; break; } }
    C.sections.forEach(function (S, i) {
      var r = store.sections[S.id], unlocked = i === 0 || secDone(i - 1);
      var b = h('button', 'sec' + (unlocked ? '' : ' locked') + (i === nextIdx ? ' next' : ''),
        '<span class="num' + (r && r.done ? ' done' : '') + '">' + (r && r.done ? '✓' : (unlocked ? i + 1 : '🔒')) + '</span><span><b>' + esc(S.title) + '</b><small>' + esc(S.blurb) + ' · about ' + S.mins + ' min</small></span>' + (r && r.done ? '<span class="grade">' + letter(r.pct) + '</span>' : ''));
      b.onclick = function () { K.sfx.tap(); section(i, 0); };
      grid.appendChild(b);
    });
    card.appendChild(grid);
    var fr = h('div', 'final-row center');
    var fb = h('button', 'btn' + (allDone() && !store.final ? ' pulse' : ''), (store.final ? '🏆 Final Challenge: ' + letter(store.final.pct) + ' (retake)' : '🏆 Final Challenge'));
    fb.disabled = !allDone();
    fb.onclick = function () { K.sfx.tap(); finalQuiz(); };
    fr.appendChild(fb);
    if (!allDone()) { fr.appendChild(h('p', 'note', 'Finish all ' + N + ' sections to unlock the Final Challenge.')); }
    if (store.final) {
      var cb = h('button', 'btn alt pulse', '🎓 ' + (store.cert ? 'See my certificate' : 'Get my certificate')); cb.onclick = function () { K.sfx.tap(); cert(); };
      var r2 = h('div', 'row'); r2.appendChild(cb); fr.appendChild(r2);
    }
    card.appendChild(fr);
    var rr = h('div', 'row noprint'), reset = h('button', 'btn ghost small', '↺ Start over'), armed = false;
    reset.onclick = function () {
      if (!armed) { armed = true; reset.textContent = 'Tap again to erase all progress'; setTimeout(function () { armed = false; reset.textContent = '↺ Start over'; }, 4000); return; }
      store = { name: '', sections: {}, final: null, secs: 0, startedAt: null, finishedAt: null, cert: null, sent: false }; save(); welcome();
    };
    rr.appendChild(reset); card.appendChild(rr);
    show(card);
  }

  /* ---------- section pages ---------- */
  function section(si, pi) {
    var S = C.sections[si], P = S.pages[pi], total = S.pages.length;
    var card = h('div', 'card'), reviewing = secDone(si);
    card.appendChild(h('div', 'note', 'SECTION ' + (si + 1) + ' OF ' + N + ' · ' + esc(S.title.toUpperCase())));
    var dots = h('div', 'dots'); for (var d = 0; d <= total; d++) { dots.appendChild(h('i', d === pi ? 'on' : d < pi ? 'done' : '')); } card.appendChild(dots);
    var nextBtn = h('button', 'btn pulse', pi < total - 1 ? 'Next ▶' : '🎯 Take the quiz ▶');
    nextBtn.onclick = function () { K.sfx.tap(); if (pi < total - 1) { section(si, pi + 1); } else { quiz(si); } };
    if (P.t === 'read') {
      if (P.art) { card.appendChild(h('div', '', K.art.scene(P.art))); card.lastChild.className = ''; }
      card.appendChild(h('h2', 'pt', esc(P.title)));
      var rb = readBlock(P.text, P.list); card.appendChild(rb.p);
      if (P.list) { var ul = h('ul', 'points'); P.list.forEach(function (l) { ul.appendChild(h('li', '', '<i>' + l[0] + '</i><span>' + esc(l[1]) + '</span>')); }); card.appendChild(ul); }
      var rr = h('div', 'row'); rr.appendChild(rb.btn); card.appendChild(rr);
      if (P.vocab) {
        var vb = h('div', 'vocab'), def = h('div', 'vdef hidden');
        P.vocab.forEach(function (v) {
          var c = h('button', 'vchip', '📖 ' + esc(v[0]));
          c.onclick = function () { K.sfx.pop(1); Array.prototype.forEach.call(vb.children, function (x) { x.classList.remove('open'); }); c.classList.add('open'); def.classList.remove('hidden'); def.innerHTML = '<b>' + esc(v[0]) + ':</b> ' + esc(v[1]); K.say(v[0] + '. ' + v[1]); };
          vb.appendChild(c);
        });
        card.appendChild(h('div', 'note', 'Tap a word to learn it'));
        card.appendChild(vb); card.appendChild(def);
      }
      if (P.tip) { card.appendChild(tipBox(P.tip)); }
    } else {
      card.appendChild(h('h2', 'pt', esc(P.title)));
      var ab = readBlock(P.text); card.appendChild(ab.p);
      var ar = h('div', 'row'); ar.appendChild(ab.btn); card.appendChild(ar);
      var box = h('div', ''); card.appendChild(box);
      var fin = false;
      var unlock = function () { if (fin) { return; } fin = true; nextBtn.disabled = false; nextBtn.classList.add('pulse'); setTimeout(function () { nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 150); };
      if (!reviewing) { nextBtn.disabled = true; nextBtn.classList.remove('pulse'); }
      K.acts[P.kind](box, P.cfg || {}, { done: unlock });
    }
    var nav = h('div', 'nav');
    var back = h('button', 'btn ghost', '◀ Back'); back.onclick = function () { K.sfx.tap(); if (pi > 0) { section(si, pi - 1); } else { map(); } };
    nav.appendChild(back); nav.appendChild(h('div', 'mid', 'Page ' + (pi + 1) + ' of ' + total)); nav.appendChild(nextBtn);
    card.appendChild(nav);
    show(card);
  }

  /* ---------- quiz runner ---------- */
  function runQuiz(title, qs, onDone) {
    var q = 0, correct = 0, log = [], card = h('div', 'card');
    function showQ() {
      card.innerHTML = ''; K.stop();
      var Q = qs[q], tries = 0;
      card.appendChild(h('div', 'qhead', '<span>🎯 ' + esc(title) + '</span><span>Question ' + (q + 1) + ' of ' + qs.length + '</span>'));
      var dots = h('div', 'dots'); qs.forEach(function (x, i) { dots.appendChild(h('i', i === q ? 'on' : i < q ? 'done' : '')); }); card.appendChild(dots);
      card.appendChild(h('p', 'q', esc(Q.q)));
      var rr = h('div', 'row'), rd = h('button', 'btn alt small', '🔊 Read to me');
      rd.onclick = function () { K.sfx.tap(); K.say(Q.q + '. ' + Q.o.map(function (o, i) { return 'Choice ' + 'ABCD'.charAt(i) + '. ' + o; }).join('. ')); };
      rr.appendChild(rd); card.appendChild(rr);
      var box = h('div', 'opts'), fb = h('div', 'fb'), nr = h('div', 'row'), solved = false;
      shuffle(Q.o.map(function (t, i) { return { t: t, ok: i === Q.a }; })).forEach(function (o) {
        var b = h('button', 'opt', esc(o.t));
        b.onclick = function () {
          if (solved || b.disabled) { return; }
          if (o.ok) {
            solved = true; b.classList.add('good'); K.sfx.ok();
            Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; });
            if (tries === 0) { correct++; K.sfx.sat(); }
            log.push({ q: Q.q, tries: tries + 1 });
            fb.className = 'fb good'; fb.textContent = (tries === 0 ? 'Correct! +10 sats. ' : 'Correct! ') + Q.why;
            var nb = h('button', 'btn pulse', q < qs.length - 1 ? 'Next question ▶' : 'Finish ▶');
            nb.onclick = function () { K.sfx.tap(); if (q < qs.length - 1) { q++; showQ(); window.scrollTo(0, 0); } else { onDone(correct, qs.length, log); } };
            nr.appendChild(nb); setTimeout(function () { nb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 120);
          } else { tries++; b.classList.add('bad'); b.disabled = true; K.sfx.no(); fb.className = 'fb bad'; fb.textContent = 'Not quite. Hint: ' + Q.hint; }
        };
        box.appendChild(b);
      });
      card.appendChild(box); card.appendChild(fb); card.appendChild(nr);
    }
    showQ(); show(card);
  }
  function stars(p) { var n = p >= 90 ? 3 : p >= 70 ? 2 : 1, s = ''; for (var i = 1; i <= 3; i++) { s += '<span>' + K.art.coin(i <= n ? 'star' : 'starOff') + '</span>'; } return '<div class="stars">' + s + '</div>'; }
  function missedList(log) { return log.filter(function (l) { return l.tries > 1; }).map(function (l) { return l.q; }); }

  function quiz(si) {
    var S = C.sections[si];
    runQuiz(S.title + ' Quiz', S.quiz, function (c, t, log) {
      var p = pct(c, t), r = store.sections[S.id] || { attempts: 0, sats: 0, pct: -1 };
      var newSats = c * 10 + 25, gain = Math.max(0, newSats - (r.sats || 0));
      r.attempts = (r.attempts || 0) + 1; r.done = true;
      if (p >= r.pct) { r.pct = p; r.correct = c; r.total = t; r.missed = missedList(log); }
      r.sats = Math.max(r.sats || 0, newSats); store.sections[S.id] = r;
      save();
      var card = h('div', 'card center');
      card.appendChild(h('h1', 'title', 'Section ' + (si + 1) + ' Complete!'));
      card.appendChild(h('div', 'big-grade', letter(p)));
      card.appendChild(h('p', 'sub', 'You got <b>' + c + ' of ' + t + '</b> right on the first try (' + p + '%)'));
      card.insertAdjacentHTML('beforeend', stars(p));
      card.appendChild(h('div', 'earn', K.art.coin('sat') + (gain > 0 ? '+' + gain + ' sats earned!' : 'Beat your best score to earn more sats!')));
      if (p < 100) { card.appendChild(h('p', 'note', 'Tip: you can retake the quiz to improve your grade. Your best grade counts.')); }
      var row = h('div', 'row');
      var mp = h('button', 'btn ghost', '🗺️ Course map'); mp.onclick = function () { K.sfx.tap(); map(); };
      var rt = h('button', 'btn ghost', '↻ Retake quiz'); rt.onclick = function () { K.sfx.tap(); quiz(si); };
      row.appendChild(mp); if (p < 100) { row.appendChild(rt); }
      if (si < N - 1) { var nx = h('button', 'btn pulse', 'Next section ▶'); nx.onclick = function () { K.sfx.tap(); section(si + 1, 0); }; row.appendChild(nx); }
      else { var fc = h('button', 'btn pulse', '🏆 Final Challenge ▶'); fc.onclick = function () { K.sfx.tap(); finalQuiz(); }; row.appendChild(fc); }
      card.appendChild(row);
      show(card); K.sfx.win(); coinRain(14 + c * 3);
      K.say(p >= 90 ? 'Amazing work, ' + store.name + '! You earned an ' + letter(p) + '.' : 'Nice job, ' + store.name + '! Keep going.');
    });
  }

  function finalQuiz() {
    runQuiz(C.final.title, C.final.questions, function (c, t, log) {
      var p = pct(c, t), prev = store.final, newSats = c * 15 + 50, gain = Math.max(0, newSats - (prev ? prev.sats : 0));
      if (!prev || p >= prev.pct) { store.final = { correct: c, total: t, pct: p, sats: Math.max(newSats, prev ? prev.sats : 0), attempts: (prev ? prev.attempts : 0) + 1, missed: missedList(log) }; }
      else { prev.attempts++; prev.sats = Math.max(newSats, prev.sats); store.final = prev; }
      save();
      var card = h('div', 'card center');
      card.appendChild(h('h1', 'title', 'Final Challenge Done!'));
      card.appendChild(h('div', 'big-grade', letter(p)));
      card.appendChild(h('p', 'sub', 'You got <b>' + c + ' of ' + t + '</b> right on the first try (' + p + '%)'));
      card.insertAdjacentHTML('beforeend', stars(p));
      card.appendChild(h('div', 'earn', K.art.coin('sat') + (gain > 0 ? '+' + gain + ' sats earned!' : 'Beat your best score to earn more sats!')));
      var row = h('div', 'row');
      var mp = h('button', 'btn ghost', '🗺️ Course map'); mp.onclick = function () { K.sfx.tap(); map(); };
      var rt = h('button', 'btn ghost', '↻ Retake'); rt.onclick = function () { K.sfx.tap(); finalQuiz(); };
      var cb = h('button', 'btn pulse', '🎓 Get my certificate ▶'); cb.onclick = function () { K.sfx.tap(); cert(); };
      row.appendChild(mp); if (p < 100) { row.appendChild(rt); } row.appendChild(cb); card.appendChild(row);
      show(card); K.sfx.win(); coinRain(30);
      K.say('You finished the course, ' + store.name + '! Great job!');
    });
  }

  /* ---------- certificate + email ---------- */
  function dateStr(ts) { return new Date(ts).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }); }
  function buildReport() {
    var op = overall(), mins = Math.max(1, Math.round(store.secs / 60)), lines = [], i, r;
    lines.push('KIDS CRYPTO ACADEMY: COURSE REPORT', '', 'Student: ' + store.cert.name, 'Course: ' + C.title, 'Completed: ' + dateStr(store.cert.date), 'Active learning time: about ' + mins + ' min', '', 'SECTION GRADES');
    for (i = 0; i < N; i++) {
      r = store.sections[C.sections[i].id]; if (!r) { continue; }
      lines.push((i + 1) + '. ' + C.sections[i].title + ': ' + r.correct + '/' + r.total + ' (' + r.pct + '%) ' + letter(r.pct) + '   [quiz attempts: ' + r.attempts + ']');
      (r.missed || []).forEach(function (m) { lines.push('     missed on first try: ' + m); });
    }
    if (store.final) {
      lines.push('Final Challenge: ' + store.final.correct + '/' + store.final.total + ' (' + store.final.pct + '%) ' + letter(store.final.pct) + '   [attempts: ' + store.final.attempts + ']');
      (store.final.missed || []).forEach(function (m) { lines.push('     missed on first try: ' + m); });
    }
    lines.push('', 'OVERALL COURSE GRADE: ' + op + '% (' + letter(op) + ')', 'Sats earned: ' + totalSats(), '',
      'CERTIFICATE OF COMPLETION', 'Awarded to: ' + store.cert.name, 'For completing: ' + C.title + ' (' + C.series + ')', 'Overall grade: ' + letter(op) + ' (' + op + '%)', 'Date: ' + dateStr(store.cert.date), 'Issued by ' + C.org);
    return { subject: C.series + ': ' + store.cert.name + ' finished ' + C.title + ': ' + op + '% (' + letter(op) + ')', message: lines.join('\n') };
  }
  function cert() {
    if (!store.final) { map(); return; }
    if (!store.cert) { certName(); return; }
    renderCert();
  }
  function certName() {
    var card = h('div', 'card center welcome');
    card.appendChild(h('h1', 'title', 'You Did It! 🎉'));
    card.appendChild(h('p', 'sub', 'Type your name exactly how you want it to look on your certificate.'));
    var inp = h('input'); inp.type = 'text'; inp.maxLength = 40; inp.value = (store.cert && store.cert.name) || store.name || ''; inp.placeholder = 'Your full name'; inp.autocomplete = 'off';
    var ir = h('div', 'row'); ir.appendChild(inp); card.appendChild(ir);
    var go = h('button', 'btn pulse', '🎓 Make my certificate'); go.disabled = !inp.value.trim();
    inp.oninput = function () { go.disabled = !inp.value.trim(); };
    inp.onkeydown = function (e) { if (e.key === 'Enter' && inp.value.trim()) { go.click(); } };
    go.onclick = function () {
      store.cert = { name: inp.value.trim().replace(/\s+/g, ' '), date: Date.now() }; store.sent = false; if (!store.finishedAt) { store.finishedAt = Date.now(); } save(); K.sfx.win(); renderCert();
    };
    var gr = h('div', 'row'); gr.appendChild(go); card.appendChild(gr);
    show(card);
  }
  function renderCert() {
    var op = overall(), wrap = h('div', 'certwrap');
    var seal = '<svg class="seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#f5b82e" stroke="#c98a00" stroke-width="4"/><circle cx="50" cy="50" r="36" fill="none" stroke="#fff6d6" stroke-width="2" stroke-dasharray="4 3"/>' + '<g transform="translate(28 28) scale(.88)">' + K.art.coin('btc').replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '') + '</g></svg>';
    var c = h('div', 'cert',
      '<img class="brandlogo certlogo" alt="' + esc(C.org) + '" src="' + K.LOGO + '">' + '<div class="org">' + esc(C.series.toUpperCase()) + '</div><h1>Certificate of Completion</h1><div class="of">THIS CERTIFIES THAT</div>' +
      '<div class="nm">' + esc(store.cert.name) + '</div><div class="of">HAS SUCCESSFULLY COMPLETED THE COURSE</div><div class="crs">' + esc(C.title) + '</div>' +
      '<div class="meta">Overall grade: <b>' + letter(op) + ' (' + op + '%)</b> · ' + dateStr(store.cert.date) + '</div>' +
      '<div class="sig">Issued by<b>' + esc(C.org) + '</b></div>' + seal);
    var card = h('div', 'card');
    card.appendChild(h('div', 'noprint'));
    card.firstChild.innerHTML = '<h2 class="pt center">🎓 Your Certificate</h2>';
    wrap.appendChild(c); card.appendChild(wrap);
    var st = h('p', 'note noprint', '');
    card.appendChild(st);
    var tb = h('table', 'gtable noprint'), rows = '', i, r;
    for (i = 0; i < N; i++) { r = store.sections[C.sections[i].id]; if (r) { rows += '<tr><td>' + (i + 1) + '. ' + esc(C.sections[i].title) + '</td><td>' + r.pct + '% ' + letter(r.pct) + '</td></tr>'; } }
    if (store.final) { rows += '<tr><td>Final Challenge</td><td>' + store.final.pct + '% ' + letter(store.final.pct) + '</td></tr>'; }
    rows += '<tr><td><b>Overall grade</b></td><td><b>' + op + '% ' + letter(op) + '</b></td></tr>';
    tb.innerHTML = rows; card.appendChild(tb);
    var row = h('div', 'row noprint');
    var pr = h('button', 'btn', '🖨️ Print or save as PDF'); pr.onclick = function () { window.print(); };
    var ch = h('button', 'btn ghost', '✏️ Change name'); ch.onclick = function () { certName(); };
    var mp = h('button', 'btn ghost', '🗺️ Course map'); mp.onclick = function () { map(); };
    var hub = h('a', 'btn alt', '🏠 More courses'); hub.href = C.hubFile;
    row.appendChild(pr); row.appendChild(ch); row.appendChild(mp); row.appendChild(hub); card.appendChild(row);
    if (!K.hasKey()) { card.appendChild(K.setupPanel()); }
    show(card); coinRain(24);
    function send() {
      if (store.sent) {
        st.textContent = K.pendingCount() ? (K.hasKey() ? '\uD83D\uDCE7 Your report is saved and will be sent soon.' : '\uD83D\uDCE7 Report saved. A grown-up needs to finish the email setup below.') : '\uD83D\uDCE7 Your grades and certificate were emailed to your teacher.';
        return;
      }
      K.sendReport(buildReport()).then(function (res) {
        store.sent = true; save();
        st.textContent = res === 'sent' ? '\uD83D\uDCE7 Your grades and certificate were emailed to your teacher!' : res === 'queued' ? '\uD83D\uDCE7 Your report is saved and will be sent when the internet is back.' : '\uD83D\uDCE7 Report saved. A grown-up needs to finish the email setup below so it can be sent.';
      });
    }
    send();
  }
  /* once a key is added later, retry any report that was queued without a key */
  K.flush();

  K.dbg = { store: function () { return store; }, map: map, section: section, quiz: quiz, finalQuiz: finalQuiz, cert: cert, report: function () { return buildReport(); }, welcome: welcome };
  syncBtns(); chips(); welcome();
})();
</script>
</body></html>
